name: Build StorCLI Docker Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Motorola Curation Artifactory
        uses: docker/login-action@v3
        with:
          registry: curation.motorolasolutions.com
          username: ${{ secrets.ARTIFACTORY_USER }}
          password: ${{ secrets.ARTIFACTORY_TOKEN }}

      - name: Build and push Docker image to JFrog
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            curation.motorolasolutions.com/<your-docker-repo>/storcli:1.21.06
            curation.motorolasolutions.com/<your-docker-repo>/storcli:latest
